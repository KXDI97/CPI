<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase CPI</title>
    <link rel="icon" type="image/png" href="../Images/logo.png">
    <link rel="stylesheet" href="../Styles/HeaderSlider-Style.css">
    <link rel="stylesheet" href="../Styles/theme.css">
    <link rel="stylesheet" href="../Styles/Savings-Style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Styles/Purchase-Style.css">
    <style>body { visibility: hidden }</style>
    <script src="../Scripts/translations.js"></script>
    <script src="../Scripts/ui-helpers.js"></script>
    <script>initTheme(); checkAuth();</script>
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
 
    <div class="content-Purchase">
 
        <!-- HEADER -->
        <section class="purchase-header">
            <h1>Purchase</h1>
 
            <!-- Search + Filtros juntos -->
            <div class="search-filter-group">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search product..." />
                    <button onclick="buscarProducto()"><ion-icon name="search-outline"></ion-icon></button>
                </div>
                <button class="filter-btn" id="filter-toggle-btn">
                    <ion-icon name="options-outline"></ion-icon>
                </button>
            </div>
 
            <!-- Panel de filtros -->
            <div id="filtro-panel" class="filtro-panel" style="display: none;">
                <label>Category:
                    <select id="filtro-categoria">
                        <option value="">All</option>
                        <option value="Cartuchos">Cartuchos</option>
                        <option value="Tintas">Tintas</option>
                        <option value="Papelería">Papelería</option>
                        <option value="Computers">Computers</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </label>
                <label>Max price:
                    <input type="number" id="filtro-precio" placeholder="e.g. 50000" />
                </label>
                <label>From:
                    <input type="date" id="filtro-fecha-inicio" />
                </label>
                <label>To:
                    <input type="date" id="filtro-fecha-fin" />
                </label>
                <button onclick="aplicarFiltros()">Apply filters</button>
            </div>
        </section>
 
        <!-- CARRUSEL -->
        <div class="swiper-container-wrapper">
            <div class="swiper-button-prev"></div>
            <section class="swiper mySwiper">
                <div class="swiper-wrapper" id="product-carousel"></div>
            </section>
            <div class="swiper-button-next"></div>
        </div>
 
        <!-- BOTÓN NUEVO PROVEEDOR (flotante) -->
        <button id="btn-nuevo-proveedor" onclick="abrirModalProveedor()" class="btn-nuevo-proveedor-float" title="New Supplier">
            <ion-icon name="person-add-outline"></ion-icon>
        </button>
 
        <!-- BOTÓN CARRITO (flotante) -->
        <button id="toggle-cart-btn" onclick="abrirCarrito()" class="btn-ver-carrito" title="Shopping Cart">
            <ion-icon name="cart-outline"></ion-icon>
            <span id="cart-badge" class="cart-badge" style="display:none">0</span>
        </button>
 
        <!-- MODAL CARRITO -->
        <div id="carrito-modal" class="modal-carrito">
            <div class="carrito-contenido">
                <span class="cerrar-modal" onclick="cerrarCarrito()">×</span>
                <h2>🛒 Shopping Cart</h2>
                <table class="factura-tabla">
                    <thead>
                        <tr>
                            <th>Code</th>
                            <th>Product</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>VAT</th>
                            <th>Costs</th>
                            <th>Total</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-carrito"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="6" style="text-align:right;padding-right:16px">Total:</td>
                            <td colspan="2"><strong>$<span id="total-carrito">0.00</span></strong></td>
                        </tr>
                    </tfoot>
                </table>
                <button type="button" onclick="cerrarCarrito(); abrirModalCompra()">Register Purchase</button>
            </div>
        </div>
 
        <!-- MODAL NUEVO PROVEEDOR -->
        <div id="modal-nuevo-proveedor" class="modal" style="display: none;">
            <form id="form-nuevo-proveedor" class="modal-content">
                <span class="close-modal" onclick="cerrarModalProveedor()">×</span>
                <h2>New Supplier</h2>
                <label>Name: <input type="text" id="supplier-name" required /></label>
                <label>Document/NIT: <input type="text" id="supplier-document" required /></label>
                <label>Email: <input type="email" id="supplier-email" required /></label>
                <label>Phone: <input type="text" id="supplier-phone" required /></label>
                <label>Address: <input type="text" id="supplier-address" /></label>
                <button type="submit" class="btn-confirmar">Create Supplier</button>
            </form>
        </div>
 
        <!-- MODAL REGISTRO DE COMPRA -->
        <div id="modal-registro" class="modal" style="display: none;">
            <form id="form-compra" class="modal-content">
                <span class="close-modal" onclick="cerrarModalCompra()">×</span>
                <h2>Register Purchase</h2>
                <label>Order Number: <input type="text" id="order-number" readonly /></label>
                <label>Supplier:
                    <select id="supplier-select" required>
                        <option value="">Select a supplier</option>
                    </select>
                </label>
                <label>Purchase Date: <input type="date" id="purchase-date" required /></label>
                <label>Payment Method:
                    <select id="payment-method" required>
                        <option value="">Select payment method</option>
                        <option value="cash">Cash</option>
                        <option value="debit">Debit</option>
                        <option value="credit">Credit</option>
                        <option value="transfer">Transfer</option>
                    </select>
                </label>
                <p class="total-row"><strong>Total:</strong> $<span id="total-final-modal">0.00</span></p>
                <button type="submit" class="btn-confirmar">Process Purchase</button>
            </form>
        </div>
 
        <!-- MODAL FACTURA -->
        <div id="factura-modal" class="modal-factura">
            <div class="factura-contenido">
                <span class="cerrar-modal" onclick="cerrarFactura()">×</span>
                <h2>📄 Purchase Invoice</h2>
                <p><strong>Order:</strong> <span id="factura-orden"></span></p>
                <p><strong>Supplier:</strong> <span id="factura-cliente"></span></p>
                <p><strong>Date:</strong> <span id="factura-fecha"></span></p>
                <table class="factura-tabla">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>VAT</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="factura-productos"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" style="text-align:right">Total:</td>
                            <td><strong>$<span id="factura-total"></span></strong></td>
                        </tr>
                    </tfoot>
                </table>
                <button onclick="window.print()" class="btn-imprimir">🖨️ Print invoice</button>
            </div>
        </div>
 
    </div>
 
    <script type="module">
        import { loadComponents } from '../Scripts/Components.js';
        loadComponents();
    </script>
    <script type="module" src="../Scripts/Main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
    <script src="../Scripts/Purchase.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="../Scripts/Session.js"></script>
</body>
</html>
