<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - CPI</title>
    <link rel="icon" type="image/png" href="../Images/logo.png">
    <link rel="stylesheet" href="../Styles/HeaderSlider-Style.css">
    <link rel="stylesheet" href="../Styles/theme.css">
    <link rel="stylesheet" href="../Styles/Storage-Style.css">
    <link rel="stylesheet" href="../Styles/Clients-Style.css">
    <link rel="stylesheet" href="../Styles/AdminUsers-Style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>body { visibility: hidden }</style>
    <script src="../Scripts/translations.js"></script>
    <script src="../Scripts/ui-helpers.js"></script>
    <script>initTheme(); checkAdminAccess();</script>
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="content-Storage">
        <h1>User Management</h1>
        <div class="controls">
            <div class="search-bar">
                <input type="text" id="userSearch" placeholder="Search user...">
                <ion-icon name="search-outline"></ion-icon>
            </div>
            <button class="btn-1" id="addUserBtn">
                <ion-icon name="person-add-outline"></ion-icon> Add User
            </button>
        </div>

        <div class="table-container">
            <h2>Registered Users</h2>
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminUsersTableBody"></tbody>
            </table>
            <div id="usersEmptyMsg">No users found.</div>
        </div>

        <div class="pagination" id="usersPagination"></div>
    </div>

    <!-- Add User Modal -->
    <div id="addUserBackdrop" class="backdrop hidden"></div>
    <div id="addUserModal" class="edit-role-modal hidden" style="width:500px;">
        <div class="erm-header">
            <div class="erm-icon-wrap">
                <ion-icon name="person-add-outline"></ion-icon>
            </div>
            <h2>Add User</h2>
            <p class="erm-subtitle">Fill in the user information</p>
        </div>
        <div class="erm-body">
            <div class="aum-grid">
                <!-- Username -->
                <div class="aum-col">
                    <p class="erm-label">Username</p>
                    <input type="text" id="newUsername" class="aum-input" placeholder="e.g. johndoe" autocomplete="off">
                </div>
                <!-- Email -->
                <div class="aum-col">
                    <p class="erm-label">Email</p>
                    <input type="email" id="newEmail" class="aum-input" placeholder="user@example.com" autocomplete="off">
                </div>
                <!-- Password -->
                <div class="aum-col">
                    <p class="erm-label">Password</p>
                    <input type="password" id="newPassword" class="aum-input" placeholder="Min. 6 characters" autocomplete="new-password">
                </div>
                <!-- Role dropdown -->
                <div class="aum-col">
                    <p class="erm-label">Role</p>
                    <select id="newRole" class="aum-select">
                        <option value="Viewer">Viewer</option>
                        <option value="Seller">Seller &amp; clients</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
            </div>
            <p id="addUserError" class="modal-error" style="margin-top:10px;"></p>
        </div>
        <div class="erm-footer">
            <button class="erm-btn-save" id="confirmAddUser">Add User</button>
            <button class="erm-btn-cancel" id="cancelAddUser">Cancel</button>
        </div>
    </div>

    <!-- Edit Role Modal -->
    <div id="editRoleBackdrop" class="backdrop hidden"></div>
    <div id="editRoleModal" class="edit-role-modal hidden">
        <div class="erm-header">
            <div class="erm-icon-wrap">
                <ion-icon name="shield-checkmark-outline"></ion-icon>
            </div>
            <h2>Edit Role</h2>
            <p class="erm-subtitle" id="editRoleSubtitle"></p>
        </div>
        <div class="erm-body">
            <p class="erm-label">Select a role</p>
            <div class="erm-role-cards" id="editRoleCards">
                <div class="erm-card" data-role="Admin">
                    <span class="erm-dot" style="background:#34d399;"></span>
                    <div>
                        <span class="erm-card-title">Admin</span>
                        <span class="erm-card-desc">Full access</span>
                    </div>
                </div>
                <div class="erm-card" data-role="Seller">
                    <span class="erm-dot" style="background:#60a5fa;"></span>
                    <div>
                        <span class="erm-card-title">Seller</span>
                        <span class="erm-card-desc">Sales &amp; clients</span>
                    </div>
                </div>
                <div class="erm-card" data-role="Viewer">
                    <span class="erm-dot" style="background:#9ca3af;"></span>
                    <div>
                        <span class="erm-card-title">Viewer</span>
                        <span class="erm-card-desc">Read only</span>
                    </div>
                </div>
                <div class="erm-card" data-role="Deactivated">
                    <span class="erm-dot" style="background:#f87171;"></span>
                    <div>
                        <span class="erm-card-title">Deactivated</span>
                        <span class="erm-card-desc">No access</span>
                    </div>
                </div>
            </div>
            <p id="editRoleError" class="modal-error" style="margin-top:10px;"></p>
        </div>
        <div class="erm-footer">
            <button class="erm-btn-save" id="confirmEditRole">Save Changes</button>
            <button class="erm-btn-cancel" id="cancelEditRole">Cancel</button>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteBackdrop" class="backdrop hidden"></div>
    <div id="deleteModal" class="edit-role-modal hidden">
        <div class="erm-header del-header">
            <div class="del-icon-wrap">
                <ion-icon name="trash-outline"></ion-icon>
            </div>
            <h2>Delete User</h2>
            <p class="del-username" id="deleteUsername"></p>
        </div>
        <div class="erm-body">
            <p class="del-confirm-msg" id="deleteMsg"></p>
        </div>
        <div class="erm-footer">
            <button class="del-btn-confirm" id="confirmDelete">Delete</button>
            <button class="erm-btn-cancel" id="cancelDelete">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { loadComponents } from '../Scripts/Components.js';
        loadComponents();
    </script>
    <script type="module" src="../Scripts/Main.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="../Scripts/Session.js"></script>
    <script src="../Scripts/AdminUsers.js"></script>
</body>
</html>
