<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Images/Logo - CPI.png" type="image/png">
    <title>Clients CPI</title>
    <link rel="icon" type="image/png" href="../Images/logo.png">
    <link rel="stylesheet" href="../Styles/HeaderSlider-Style.css">
    <link rel="stylesheet" href="../Styles/theme.css">
    <link rel="stylesheet" href="../Styles/Clients-Style.css">
    <link rel="stylesheet" href="../Styles/AdminUsers-Style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>body { visibility: hidden }</style>
    <script src="../Scripts/translations.js"></script>
    <script src="../Scripts/ui-helpers.js"></script>
    <script>initTheme(); checkAuth();</script>
</head>

<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="content-Clients">
        <h1>Client's Information</h1>

    <div class="controls">
        <button id="openClientModal" class="btn-1">
            <ion-icon name="add-circle"></ion-icon> Add client
        </button>
        <div class="search-bar">
        <input type="text" id="search-client" placeholder="Search Client..." />
        <ion-icon name="search-outline"></ion-icon>
        </div>
    </div>

    <!-- Grid donde se van a renderizar las tarjetas dinámicamente -->
    <div class="clientes-grid" id="clientesGrid"></div>


    <!-- Backdrop -->
    <div id="modalBackdrop" class="backdrop hidden"></div>

    <!-- Add Client Modal -->
    <div id="clientModal" class="edit-role-modal hidden" style="width:90%;max-width:600px;">
        <div class="erm-header">
            <div class="erm-icon-wrap">
                <ion-icon name="briefcase-outline"></ion-icon>
            </div>
            <h2>Add Client</h2>
            <p class="erm-subtitle">Fill in the client information</p>
        </div>
        <div class="erm-body">
            <div class="aum-grid">
                <div class="aum-col">
                    <p class="erm-label">Name *</p>
                    <input type="text" id="client-name" class="aum-input" placeholder="Client name" required autocomplete="off">
                </div>
                <div class="aum-col">
                    <p class="erm-label">Client Type *</p>
                    <select id="client-type" class="aum-select">
                        <option value="Empresa">Empresa</option>
                        <option value="Persona">Persona</option>
                    </select>
                </div>
                <div class="aum-col">
                    <p class="erm-label">Document Type *</p>
                    <select id="client-doc-type" class="aum-select">
                        <option value="RUT">RUT</option>
                        <option value="NIT">NIT</option>
                        <option value="CC">CC</option>
                        <option value="CE">CE</option>
                        <option value="PAS">PAS</option>
                    </select>
                </div>
                <div class="aum-col">
                    <p class="erm-label">Document ID *</p>
                    <input type="text" id="client-doc-id" class="aum-input" placeholder="123456789-0" required autocomplete="off">
                </div>
                <div class="aum-col">
                    <p class="erm-label">Email</p>
                    <input type="email" id="client-email" class="aum-input" placeholder="email@example.com" autocomplete="off">
                </div>
                <div class="aum-col">
                    <p class="erm-label">Phone</p>
                    <input type="text" id="client-phone" class="aum-input" placeholder="+57 300 000 0000" autocomplete="off">
                </div>
                <div class="aum-col aum-col--full">
                    <p class="erm-label">Website</p>
                    <input type="text" id="client-website" class="aum-input" placeholder="https://example.com" autocomplete="off">
                </div>
                <div class="aum-col aum-col--full">
                    <p class="erm-label">Address</p>
                    <input type="text" id="client-address" class="aum-input" placeholder="Calle 123 #45-67, Bogotá" autocomplete="off">
                </div>
            </div>
            <p id="client-error" class="modal-error" style="margin-top:10px;"></p>
        </div>
        <div class="erm-footer">
            <button class="erm-btn-save" id="btn-save-client">Save Client</button>
            <button class="erm-btn-cancel" id="btn-cancel-client">Cancel</button>
        </div>
    </div>

    <!-- Template para render dinámico -->
    <template id="client-card-tpl">
        <div class="cliente-card" data-id="">
            <div class="cliente-header">
            <div class="cliente-avatar"></div>
            <div>
                <h3 class="c-name"></h3>
                <p class="c-type"></p>
            </div>

            <!-- menú tres punticos -->
            <div class="menu-container">
                <button class="menu-btn" aria-label="Más opciones">
                <ion-icon name="ellipsis-vertical"></ion-icon>
                </button>
                <ul class="menu-options hidden">
                <li class="opt-edit">Editar</li>
                <li class="opt-delete">Borrar</li>
                </ul>
            </div>
            </div>

        <p><strong>Documento:</strong> <span class="c-doc"></span></p>
        <p><strong>Teléfono:</strong> <span class="c-phone"></span></p>
        <p><strong>Email:</strong> <span class="c-email"></span></p>
        <p><strong>Web:</strong> <a class="c-web" target="_blank" rel="noopener"></a></p>
        <p><strong>Dirección:</strong> <span class="c-address"></span></p>

        <!-- opcional: botones visibles -->
            <div class="card-actions" style="margin-top:8px; display:flex; gap:8px;">
            <button class="btn-1 btn-edit">Edit</button>
            <button class="btn-2 btn-delete">Delete</button>
            </div>
        </div>
        </template>

    </div>

    <!-- Scripts -->
    <script type="module">
        import { loadComponents } from '../Scripts/Components.js';
        loadComponents();
    </script>
    <script type="module" src="../Scripts/Main.js"></script>
    <script src="../Scripts/Clients.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="../Scripts/Session.js"></script>
</body>

</html>
