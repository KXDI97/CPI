<div class="container">
    <div class="header">
        <button class="hamburger">
            <ion-icon name="menu-outline"></ion-icon>
        </button>
        <div class="logo">
            <img src="../Images/Logo - CPI.png" alt="Logo de la página">
            <span class="logo-text">CPI</span>
        </div>
        <div class="user-actions">

            <!-- ── User info + dropdown ───────────────────────────── -->
            <div class="user-info">
                <button class="profile-button" aria-label="User menu" aria-expanded="false">
                    <div class="user-avatar" id="header-avatar">BS</div>
                </button>
                <div class="header-user-text">
                    <span class="username" id="header-username">Bryams Solórzano</span>
                    <span class="role-badge-header role-viewer" id="header-role-badge">Viewer</span>
                </div>

                <!-- Dropdown -->
                <div class="popup profile-popup" id="profile-popup" role="menu">

                    <!-- Avatar + info section -->
                    <div class="popup-avatar-section">
                        <div class="popup-avatar-wrap">
                            <div class="popup-avatar" id="popup-avatar">BS</div>
                        </div>
                        <h3 id="popup-name">Bryams G.</h3>
                        <p id="popup-email">solorzanobryams@gmail.com</p>
                        <span class="role-badge-popup role-viewer" id="popup-role-badge">Viewer</span>
                    </div>

                    <div class="popup-divider"></div>

                    <!-- Menu options -->
                    <div class="popup-body">
                        <button onclick="window.location.href='Profile.html'" role="menuitem">
                            <ion-icon name="person-circle-outline"></ion-icon> <span data-i18n="header.myProfile">My Profile</span>
                        </button>
                        <button onclick="window.location.href='Profile.html'" role="menuitem">
                            <ion-icon name="settings-outline"></ion-icon> <span data-i18n="header.settings">Settings</span>
                        </button>
                        <div class="popup-divider popup-divider--thin"></div>
                        <button class="popup-signout" onclick="showLogoutModal()" role="menuitem">
                            <ion-icon name="log-out-outline"></ion-icon> <span data-i18n="header.signOut">Sign out</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ── Notifications ─────────────────────────────────── -->
            <div class="notification">
                <button class="notification-button">
                    <ion-icon name="notifications-outline"></ion-icon>
                    <span id="notification-counter" class="notification-counter">0</span>
                </button>
            </div>

            <div class="popup notification-popup" id="notification-popup">
                <div class="popup-header">
                    <h3>Notificaciones</h3>
                </div>
                <div class="popup-body notifications-list">
                    <div class="notification-item">
                        <ion-icon name="alert-circle-outline"></ion-icon>
                        <div>
                            <p>Tu pedido ha sido enviado.</p>
                            <small>Hace 2 horas</small>
                        </div>
                    </div>
                    <div class="notification-item">
                        <ion-icon name="checkmark-circle-outline"></ion-icon>
                        <div>
                            <p>Cambio de contraseña exitoso.</p>
                            <small>Ayer</small>
                        </div>
                    </div>
                    <div class="notification-item">
                        <ion-icon name="gift-outline"></ion-icon>
                        <div>
                            <p>¡Tienes un nuevo bono!</p>
                            <small>Hace 3 días</small>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
