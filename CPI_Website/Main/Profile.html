<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - CPI</title>
    <link rel="icon" type="image/png" href="../Images/logo.png">
    <link rel="stylesheet" href="../Styles/HeaderSlider-Style.css">
    <link rel="stylesheet" href="../Styles/Profile-Style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { visibility: hidden }</style>
    <script src="../Scripts/ui-helpers.js"></script>
    <script>checkAuth();</script>
</head>
<body>
    <div id="header-container"></div>
    <div id="sidebar-container"></div>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <div class="pf-wrapper">

        <!-- ── Hero ──────────────────────────────────────────────────────── -->
        <div class="pf-hero">
            <div class="pf-avatar" id="pfAvatar">?</div>
            <div class="pf-hero-info">
                <h1 class="pf-hero-name" id="pfName">Loading…</h1>
                <span class="pf-role-badge" id="pfRoleBadge"></span>
                <p class="pf-hero-email" id="pfEmailDisplay"></p>
            </div>
        </div>

        <!-- ── Tabs ──────────────────────────────────────────────────────── -->
        <div class="pf-tabs-bar">
            <button class="pf-tab active" data-tab="account">
                <ion-icon name="person-outline"></ion-icon> Account
            </button>
            <button class="pf-tab" data-tab="security">
                <ion-icon name="lock-closed-outline"></ion-icon> Security
            </button>
        </div>

        <!-- ── Panel: Account ────────────────────────────────────────────── -->
        <div class="pf-panel" id="tab-account">

            <!-- Username -->
            <div class="pf-card">
                <div class="pf-card-header">
                    <div class="pf-card-icon">
                        <ion-icon name="at-outline"></ion-icon>
                    </div>
                    <div>
                        <h2>Username</h2>
                        <p class="pf-card-sub">Your public display name</p>
                    </div>
                </div>
                <div class="pf-field">
                    <label for="inpUsername">New username</label>
                    <input type="text" id="inpUsername" placeholder="Enter username" autocomplete="off">
                    <p class="pf-field-err" id="errUsername"></p>
                </div>
                <button class="pf-btn-save" id="btnSaveUsername">Save Username</button>
            </div>

            <!-- Email -->
            <div class="pf-card">
                <div class="pf-card-header">
                    <div class="pf-card-icon">
                        <ion-icon name="mail-outline"></ion-icon>
                    </div>
                    <div>
                        <h2>Email Address</h2>
                        <p class="pf-card-sub">For login and notifications</p>
                    </div>
                </div>
                <div class="pf-field">
                    <label for="inpEmail">New email</label>
                    <input type="email" id="inpEmail" placeholder="Enter email" autocomplete="off">
                    <p class="pf-field-err" id="errEmail"></p>
                </div>
                <div class="pf-field">
                    <label for="inpEmailPass">Confirm with current password</label>
                    <div class="pf-input-wrap">
                        <input type="password" id="inpEmailPass" placeholder="Enter current password" autocomplete="current-password">
                        <button class="pf-eye" data-target="inpEmailPass" type="button">
                            <ion-icon name="eye-outline"></ion-icon>
                        </button>
                    </div>
                    <p class="pf-field-err" id="errEmailPass"></p>
                </div>
                <button class="pf-btn-save" id="btnSaveEmail">Update Email</button>
            </div>

        </div><!-- /tab-account -->

        <!-- ── Panel: Security ───────────────────────────────────────────── -->
        <div class="pf-panel hidden" id="tab-security">

            <div class="pf-card">
                <div class="pf-card-header">
                    <div class="pf-card-icon">
                        <ion-icon name="shield-checkmark-outline"></ion-icon>
                    </div>
                    <div>
                        <h2>Change Password</h2>
                        <p class="pf-card-sub">Use a strong password you don't reuse</p>
                    </div>
                </div>

                <div class="pf-field">
                    <label for="inpCurrentPass">Current password</label>
                    <div class="pf-input-wrap">
                        <input type="password" id="inpCurrentPass" placeholder="Enter current password" autocomplete="current-password">
                        <button class="pf-eye" data-target="inpCurrentPass" type="button">
                            <ion-icon name="eye-outline"></ion-icon>
                        </button>
                    </div>
                    <p class="pf-field-err" id="errCurrentPass"></p>
                </div>

                <div class="pf-field">
                    <label for="inpNewPass">New password</label>
                    <div class="pf-input-wrap">
                        <input type="password" id="inpNewPass" placeholder="Minimum 8 characters" autocomplete="new-password">
                        <button class="pf-eye" data-target="inpNewPass" type="button">
                            <ion-icon name="eye-outline"></ion-icon>
                        </button>
                    </div>
                    <p class="pf-field-err" id="errNewPass"></p>
                    <div class="pf-strength" id="pwStrength">
                        <div class="pf-strength-bar"><span id="sb0"></span><span id="sb1"></span><span id="sb2"></span><span id="sb3"></span></div>
                        <span class="pf-strength-label" id="pwStrengthLabel"></span>
                    </div>
                </div>

                <div class="pf-field">
                    <label for="inpConfirmPass">Confirm new password</label>
                    <div class="pf-input-wrap">
                        <input type="password" id="inpConfirmPass" placeholder="Repeat new password" autocomplete="new-password">
                        <button class="pf-eye" data-target="inpConfirmPass" type="button">
                            <ion-icon name="eye-outline"></ion-icon>
                        </button>
                    </div>
                    <p class="pf-field-err" id="errConfirmPass"></p>
                </div>

                <button class="pf-btn-save" id="btnSavePassword">Change Password</button>
            </div>

        </div><!-- /tab-security -->

    </div><!-- /pf-wrapper -->

    <!-- Toast container -->
    <div id="pfToasts"></div>

    <script type="module">
        import { loadComponents } from '../Scripts/Components.js';
        loadComponents();
    </script>
    <script type="module" src="../Scripts/Main.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="../Scripts/Session.js"></script>
    <script src="../Scripts/Profile.js"></script>
</body>
</html>
